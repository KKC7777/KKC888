
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KKC888 Sports</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;font-family:Arial,sans-serif;color:#172033}.header{background:#073b83;color:white;padding:17px;text-align:center;font-size:24px;font-weight:bold}.nav{background:#d71920;color:white;display:flex;justify-content:space-around;padding:12px;font-weight:bold}.tabs{display:flex;gap:8px;padding:12px}.tabs button{flex:1;border:0;border-radius:7px;padding:12px;background:#d9e2ef;font-weight:bold;font-size:16px}.tabs button.active{background:#073b83;color:white}h3{margin:12px}.match{background:white;margin:12px;padding:14px;border-radius:10px;box-shadow:0 2px 7px #0001}.matchname{font-weight:bold;margin-bottom:10px}.score{font-size:16px;margin:7px 0}.status{color:#08783e;font-size:13px;margin-top:8px}.muted{color:#667085;font-size:13px}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:12px 2px;font-size:12px}.bottom a{color:#17365e;text-decoration:none;text-align:center}main{padding-bottom:65px}.error{color:#b42318}.refresh{margin:12px;background:#073b83;color:white;border:0;padding:10px 14px;border-radius:7px}</style></head><body><div class="header">KKC888 SPORTS</div><div class="nav"><span>HOME</span><span>IN-PLAY</span><span>SPORTS</span><span>GAMES</span></div><main><div class="tabs"><button id="cricketTab" class="active" onclick="showSport('cricket')">🏏 Cricket</button><button id="footballTab" onclick="showSport('football')">⚽ Football</button></div><h3 id="heading">Cricket Matches</h3><div id="matches"><div class="match">Cricket scores load ho rahe hain...</div></div><button class="refresh" onclick="loadCurrent()">↻ Refresh Scores</button><p class="muted" style="margin:12px">Scores API se milne wale data ke hisaab se update honge.</p></main><div class="bottom"><a href="index.html">🏠<br>Home</a><a href="index.html">🔴<br>In-Play</a><a href="sports.html">🏆<br>Sports</a><a href="sports.html">🎮<br>Games</a><a href="login.html">👤<br>Account</a></div><script>const API="https://soft-band-105ekkc888-football-api.kunalchoudhary-828201.workers.dev";let sport="cricket";function showSport(s){sport=s;document.getElementById("cricketTab").classList.toggle("active",s==="cricket");document.getElementById("footballTab").classList.toggle("active",s==="football");document.getElementById("heading").textContent=s==="cricket"?"Cricket Matches":"Football Live Matches";loadCurrent()}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function renderCricket(data){let list=data.data||data.matches||[];if(!Array.isArray(list))list=[];if(!list.length){document.getElementById("matches").innerHTML='<div class="match">Abhi API se koi match nahi mila.</div>';return}document.getElementById("matches").innerHTML=list.map(m=>{let scores=Array.isArray(m.score)?m.score.map(x=>'<div class="score">'+esc(x.inning||"Innings")+': <b>'+esc(x.r)+" / "+esc(x.w)+"</b> ("+esc(x.o)+" overs)</div>").join(""):"";return '<div class="match"><div class="matchname">'+esc(m.name||"Cricket Match")+'</div><div class="muted">'+esc(m.matchType||"")+' • '+esc(m.venue||"")+'</div>'+scores+'<div class="status">'+esc(m.status||"Status unavailable")+'</div><div class="muted">'+(m.matchEnded?"Completed":m.matchStarted?"In progress":"Upcoming")+'</div></div>'}).join("")}async function loadCurrent(){const box=document.getElementById("matches");box.innerHTML='<div class="match">Scores load ho rahe hain...</div>';try{if(sport==="cricket"){let r=await fetch(API+"/cricket");let d=await r.json();if(!r.ok||d.status==="failure"||d.error)throw Error(d.reason||d.error||"Cricket API error");renderCricket(d)}else{let r=await fetch(API+"/live");let d=await r.json();let list=d.response||[];if(!r.ok||d.errors&&Object.keys(d.errors).length)throw Error("Football API error");if(!list.length){box.innerHTML='<div class="match">Abhi koi live football match nahi mil raha.</div>';return}box.innerHTML=list.map(m=>'<div class="match"><div class="matchname">'+esc(m.league?.name||"Football")+'</div><div class="score">'+esc(m.teams?.home?.name)+' <b>'+esc(m.goals?.home??"-")+' - '+esc(m.goals?.away??"-")+'</b> '+esc(m.teams?.away?.name)+'</div><div class="status">'+esc(m.fixture?.status?.long||"Live")+' • '+esc(m.fixture?.status?.elapsed??"")+" min</div></div>").join("")}}catch(e){box.innerHTML='<div class="match error">Scores load nahi hue: '+esc(e.message)+'<p class="muted">API/Worker response check karo aur Refresh dabao.</p></div>'}}loadCurrent();setInterval(loadCurrent,60000);</script></body></html>
