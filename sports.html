
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KKC888 Sports</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2f8;font-family:Arial,sans-serif;color:#17243a;padding-bottom:75px}
header{background:#0754a6;color:white;padding:18px;font-size:24px;font-weight:bold}
nav{background:#d92332;display:flex;gap:24px;padding:12px;color:white;overflow-x:auto}
nav a{color:white;text-decoration:none;font-weight:bold;white-space:nowrap}
main{padding:15px;max-width:700px;margin:auto}
h2{font-size:20px}
.tabs{display:flex;gap:10px;margin:15px 0}
button{border:0;border-radius:8px;padding:12px 18px;background:#dce5f2;font-weight:bold;cursor:pointer}
button.active{background:#0754a6;color:white}
.card{background:white;padding:15px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #0001}
.tag{font-size:12px;color:#b42332;font-weight:bold}
.note{font-size:13px;color:#637087;line-height:1.5}
.match-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.league{font-size:12px;color:#637087}
.status{font-size:12px;color:#d92332;font-weight:bold}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:16px;text-align:center}
.team img{width:36px;height:36px;object-fit:contain}
.team-name{font-size:13px;font-weight:bold;margin-top:7px;overflow-wrap:anywhere}
.score{font-size:23px;font-weight:bold;white-space:nowrap}
.refresh{background:#0754a6;color:white;margin:5px 0}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px 2px;box-shadow:0 -2px 8px #0001}
.bottom a{color:#263750;text-decoration:none;font-size:12px;text-align:center}
</style>
</head>
<body>
<header>KKC888</header>
<nav>
<a href="index.html">Home</a>
<a href="sports.html">Sports</a>
<a href="login.html">Login</a>
</nav>

<main>
<h2>Sports Center</h2>
<p>Live matches aur sports updates</p>

<div class="tabs">
<button id="cricket" onclick="showSport('cricket')">🏏 Cricket</button>
<button id="football" class="active" onclick="showSport('football')">⚽ Football</button>
</div>

<button class="refresh" id="refreshBtn" onclick="loadFootball()">↻ Refresh Scores</button>
<div id="matches" aria-live="polite"></div>
<p class="note" id="statusNote">Football live scores load ho rahe hain...</p>
<p class="note">Scores sports data provider se aate hain. Har 60 seconds mein refresh hoga.</p>
</main>

<div class="bottom">
<a href="index.html">🏠<br>Home</a>
<a href="sports.html">⚽<br>In-Play</a>
<a href="sports.html">🏆<br>Sports</a>
<a href="sports.html">🎮<br>Games</a>
<a href="login.html">👤<br>Account</a>
</div>

<script>
const API_URL = "https://soft-band-105ekkc888-football-api.kunalchoudhary-828201.workers.dev/live";
let currentSport = "football";
let refreshTimer;

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function showSport(sport) {
  currentSport = sport;
  document.getElementById("cricket").classList.toggle("active", sport === "cricket");
  document.getElementById("football").classList.toggle("active", sport === "football");

  if (sport === "football") {
    loadFootball();
  } else {
    clearTimeout(refreshTimer);
    document.getElementById("matches").innerHTML =
      '<div class="card"><h3>🏏 Cricket Matches</h3><p>Cricket live scores abhi connect nahi hain.</p></div>';
    document.getElementById("statusNote").textContent =
      "Cricket scores ke liye alag data source connect karna hoga.";
  }
}

async function loadFootball() {
  if (currentSport !== "football") return;

  clearTimeout(refreshTimer);
  document.getElementById("statusNote").textContent = "Live football scores load ho rahe hain...";
  document.getElementById("refreshBtn").disabled = true;

  try {
    const response = await fetch(API_URL, { cache: "no-store" });
    if (!response.ok) throw new Error("Server response: " + response.status);

    const data = await response.json();
    if (data.error) throw new Error(data.error);
    if (!Array.isArray(data.response)) throw new Error("API data format sahi nahi hai.");

    const matches = data.response;
    const container = document.getElementById("matches");

    if (matches.length === 0) {
      container.innerHTML = '<div class="card"><h3>⚽ No Live Matches</h3><p>Is waqt API par koi live football match nahi mila.</p></div>';
    } else {
      container.innerHTML = '<h3>⚽ Live Football (' + matches.length + ')</h3>' +
        matches.map(m => {
          const home = m.teams?.home || {};
          const away = m.teams?.away || {};
          const league = m.league || {};
          const fixture = m.fixture || {};
          const status = fixture.status || {};
          const goals = m.goals || {};
          const minute = status.elapsed != null ? status.elapsed + "'" : (status.short || "LIVE");

          return '<div class="card">' +
            '<div class="match-head"><span class="league">' +
            safe(league.name || "Football") + (league.country ? " • " + safe(league.country) : "") +
            '</span><span class="status">' + safe(minute) + '</span></div>' +
            '<div class="teams">' +
            '<div class="team">' +
            (home.logo ? '<img src="' + safe(home.logo) + '" alt="" loading="lazy">' : '') +
            '<div class="team-name">' + safe(home.name || "Home") + '</div></div>' +
            '<div class="score">' + safe(goals.home ?? 0) + ' - ' + safe(goals.away ?? 0) + '</div>' +
            '<div class="team">' +
            (away.logo ? '<img src="' + safe(away.logo) + '" alt="" loading="lazy">' : '') +
            '<div class="team-name">' + safe(away.name || "Away") + '</div></div>' +
            '</div><p class="note">' + safe(status.long || "Match in progress") + '</p></div>';
        }).join("");
    }

    document.getElementById("statusNote").textContent =
      "Last updated: " + new Date().toLocaleTimeString();
  } catch (error) {
    document.getElementById("matches").innerHTML =
      '<div class="card"><h3>Scores load nahi hue</h3><p>Internet, API key aur Worker deployment check karo.</p><p class="note">' + safe(error.message) + '</p></div>';
    document.getElementById("statusNote").textContent =
      "Scores fetch karne mein dikkat aayi. Refresh karke dekho.";
  } finally {
    document.getElementById("refreshBtn").disabled = false;
    if (currentSport === "football") {
      refreshTimer = setTimeout(loadFootball, 60000);
    }
  }
}

showSport("football");
</script>
</body>
</html>
