
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KKC888 Sports</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;font-family:Arial,sans-serif;color:#172033}.header{background:#073b83;color:white;padding:17px;text-align:center;font-size:24px;font-weight:bold}.nav{background:#d71920;color:white;display:flex;justify-content:space-around;padding:12px;font-weight:bold}.tabs{display:flex;gap:6px;padding:10px;flex-wrap:wrap}.tabs button{flex:1;min-width:40%;border:0;border-radius:7px;padding:11px 5px;background:#d9e2ef;font-weight:bold;font-size:14px}.tabs button.active{background:#073b83;color:white}h3{margin:12px}.match{background:white;margin:12px;padding:14px;border-radius:10px;box-shadow:0 2px 7px #0001}.matchname{font-weight:bold;margin-bottom:10px}.score{font-size:16px;margin:7px 0}.status{color:#08783e;font-size:13px;margin-top:8px}.muted{color:#667085;font-size:13px}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:12px 2px;font-size:12px}.bottom a{color:#17365e;text-decoration:none;text-align:center}main{padding-bottom:70px}.error{color:#b42318}.refresh{margin:12px;background:#073b83;color:white;border:0;padding:10px 14px;border-radius:7px}</style></head><body><div class="header">KKC888 SPORTS</div><div class="nav"><span>HOME</span><span>IN-PLAY</span><span>SPORTS</span><span>GAMES</span></div><main><div class="tabs"><button id="cl" class="active" onclick="setMode('cl')">🏏 Cricket Live</button><button id="cu" onclick="setMode('cu')">🏏 Cricket Upcoming</button><button id="fl" onclick="setMode('fl')">⚽ Football Live</button><button id="fu" onclick="setMode('fu')">⚽ Football Upcoming</button></div><h3 id="heading">Cricket Live</h3><div id="matches"><div class="match">Matches load ho rahe hain...</div></div><button class="refresh" onclick="loadCurrent()">↻ Refresh Scores</button><p class="muted" style="margin:12px">Scores API se milne wale data ke hisaab se update honge.</p></main><div class="bottom"><a href="index.html">🏠<br>Home</a><a href="index.html">🔴<br>In-Play</a><a href="sports.html">🏆<br>Sports</a><a href="sports.html">🎮<br>Games</a><a href="login.html">👤<br>Account</a></div><script>const API="https://soft-band-105ekkc888-football-api.kunalchoudhary-828201.workers.dev";let mode="cl";function setMode(s){mode=s;document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));document.getElementById(s).classList.add("active");document.getElementById("heading").textContent=({cl:"Cricket Live",cu:"Cricket Upcoming",fl:"Football Live",fu:"Football Upcoming"})[s];loadCurrent()}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function renderCricket(d){let a=Array.isArray(d.data)?d.data:[];let live=a.filter(m=>m.matchStarted===true&&m.matchEnded!==true);let upcoming=a.filter(m=>m.matchStarted===false&&m.matchEnded!==true);let list=mode==="cl"?live:upcoming;if(!list.length){document.getElementById("matches").innerHTML='<div class="match">Is category mein API se abhi match data nahi mila. API ke currentMatches response mein live/upcoming match hona zaroori hai.</div>';return}document.getElementById("matches").innerHTML=list.map(m=>'<div class="match"><div class="matchname">'+esc(m.name||"Cricket Match")+'</div><div class="muted">'+esc(m.matchType||"")+' • '+esc(m.venue||"")+'</div>'+(Array.isArray(m.score)?m.score.map(x=>'<div class="score">'+esc(x.inning||"Innings")+': <b>'+esc(x.r)+" / "+esc(x.w)+"</b> ("+esc(x.o)+" overs)</div>").join(""):"")+'<div class="status">'+esc(m.status||"Status unavailable")+'</div><div class="muted">'+(m.matchEnded?"Completed":m.matchStarted?"In progress":"Upcoming")+'</div></div>').join("")}async function loadCurrent(){let box=document.getElementById("matches");box.innerHTML='<div class="match">Matches load ho rahe hain...</div>';try{if(mode==="cl"||mode==="cu"){let r=await fetch(API+"/cricket");let d=await r.json();if(!r.ok||d.status==="failure"||d.error)throw Error(d.reason||d.error||"Cricket API error");renderCricket(d);return}let endpoint=mode==="fl"?"/live":"/football-upcoming";let r=await fetch(API+endpoint);let d=await r.json();if(!r.ok||d.errors&&Object.keys(d.errors).length)throw Error(JSON.stringify(d.errors));let a=Array.isArray(d.response)?d.response:[];if(mode==="fu")a=a.filter(m=>["NS","TBD"].includes(m.fixture?.status?.short));if(!a.length){box.innerHTML='<div class="match">Is category mein API se abhi match data nahi mila. Football Upcoming aapke Free API plan par blocked ho sakta hai.</div>';return}box.innerHTML=a.map(m=>'<div class="match"><div class="matchname">'+esc(m.league?.name||"Football")+'</div><div class="score">'+esc(m.teams?.home?.name)+' <b>'+esc(m.goals?.home??"-")+' - '+esc(m.goals?.away??"-")+'</b> '+esc(m.teams?.away?.name)+'</div><div class="status">'+esc(m.fixture?.status?.long||"Scheduled")+(m.fixture?.status?.elapsed!=null?" • "+esc(m.fixture.status.elapsed)+" min":"")+'</div></div>').join("")}catch(e){box.innerHTML='<div class="match error">Matches load nahi hue: '+esc(e.message)+'<p class="muted">Worker/API response check karo.</p></div>'}}loadCurrent();setInterval(loadCurrent,60000);</script></body></html>
