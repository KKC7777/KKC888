<!doctype html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KKC888 Login</title>
<style>
body{margin:0;font-family:Arial;background:#edf3fa;color:#172b45}
header{background:#07366b;color:white;padding:22px;text-align:center;font-size:28px;font-weight:bold}
main{max-width:420px;margin:25px auto;padding:16px}
.card{background:white;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 4px 15px #0001}
h2{margin-top:0}
input{box-sizing:border-box;width:100%;padding:13px;margin:7px 0 14px;border:1px solid #ccd6e3;border-radius:8px}
button{width:100%;padding:13px;background:#1265b5;color:white;border:0;border-radius:8px;font-weight:bold}
.manager{background:#cf2637}
.note{font-size:12px;color:#68778b;line-height:1.5}
</style>
</head>
<body>
<header>KKC888</header>
<main>
<div class="card">
<h2>Player Login</h2>
<label>Username</label>
<input id="player" placeholder="Enter any username">
<label>Demo password</label>
<input id="ppass" type="password" placeholder="player123">
<button onclick="playerLogin()">Login as Player</button>
</div>
<div class="card">
<h2>Management Login</h2>
<label>Username</label>
<input id="manager" placeholder="manager">
<label>Demo password</label>
<input id="mpass" type="password" placeholder="admin123">
<button class="manager" onclick="managerLogin()">Login as Management</button>
</div>
<p class="note">Demo only. No real-money transactions. This page does not provide secure authentication; do not use real passwords.</p>
</main>
<script>
function playerLogin(){
let u=document.getElementById('player').value.trim();
let p=document.getElementById('ppass').value;
if(!u||p!=='player123')window.location.href = 'index.html';'Demo username daalo aur password player123 rakho.');return;}
window.location.href = 'index.html';
}
function managerLogin(){
let u=document.getElementById('manager').value.trim();
let p=document.getElementById('mpass').value;
if(u!=='manager'||p!=='admin123'){window.location.href = 'index.html';'Demo username: manager, password: admin123');return;}
window.location.href = 'index.html';
}
</script>
</body>
</html>
